  # config/local.yml — yamine configuration (Kamal-style).
  # This is the only source of truth. Run `yamine` to boot everything.
  # Overlay variants with config/local.<variant>.yml.

  service: procfile-compound-refusal

  proxy:
    tld: localhost

  processes:
    web:
      cmd: bin/rails server -p 3000 && bin/rails log:clear
      proxy: true
      # NOTE: compound line - run explicitly
    worker:
      cmd: bundle exec sidekiq | grep -v heartbeat
      proxy: false
      # NOTE: compound line - run explicitly

  env:
    clear:
      RAILS_ENV: development
